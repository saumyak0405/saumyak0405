<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="100%" stop-color="#1e180e"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#ffb000" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect width="800" height="300" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#screen)" font-family="'Fira Code','JetBrains Mono',Menlo,Consolas,monospace">
    <rect width="800" height="300" fill="url(#bg)"/>
    <rect width="800" height="300" fill="url(#scan)"/>

    <!-- title bar -->
    <rect width="800" height="38" fill="#0c0905"/>
    <circle cx="22" cy="19" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="5.5" fill="#febc2e"/>
    <circle cx="62" cy="19" r="5.5" fill="#28c840"/>
    <text x="84" y="24" font-size="12.5" fill="#a8946c">saumya@vit: ~/systems — zsh</text>
    <g>
      <rect x="626" y="11" width="156" height="17" rx="3" fill="#2a2110"/>
      <circle cx="637" cy="19.5" r="3.2" fill="#28c840">
        <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="646" y="24" font-size="11.5" fill="#ffcf66">ALL CHECKS PASSING</text>
    </g>

    <!-- name -->
    <text x="38" y="96" font-size="50" font-weight="700" fill="#ffb000" opacity=".22" letter-spacing="1">SAUMYA KHUBCHANDANI</text>
    <text x="36" y="94" font-size="50" font-weight="700" fill="#ffb000" filter="url(#glow)" letter-spacing="1">SAUMYA KHUBCHANDANI</text>
    <text x="38" y="122" font-size="13.5" fill="#a8946c">backend + applied AI  ·  B.Tech CSE (InfoSec), VIT Vellore '27</text>

    <!-- command -->
    <g font-size="15.5">
      <text x="38" y="156" fill="#ffb000">$</text>
      <text x="58" y="156" fill="#f2e6cc">./verify --profile saumyak0405</text>
    </g>

    <!-- check lines appear one by one, then stay -->
    <g font-size="14">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.25s" fill="freeze"/>
        <text x="58" y="182" fill="#7ee08a">✓</text>
        <text x="80" y="182" fill="#f2e6cc">backend</text>
        <text x="190" y="182" fill="#a8946c">java · python · typescript · postgres</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.25s" fill="freeze"/>
        <text x="58" y="204" fill="#7ee08a">✓</text>
        <text x="80" y="204" fill="#f2e6cc">agents</text>
        <text x="190" y="204" fill="#a8946c">every claim + patch re-verified before it ships</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.25s" fill="freeze"/>
        <text x="58" y="226" fill="#7ee08a">✓</text>
        <text x="80" y="226" fill="#f2e6cc">pipelines</text>
        <text x="190" y="226" fill="#a8946c">crash-safe checkpoints · idempotent upserts</text>
      </g>
    </g>

    <!-- footer -->
    <path d="M38 248H762" stroke="#4a3b1e"/>
    <g opacity="0" font-size="13">
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
      <text x="38" y="272" fill="#7ee08a">PASSED 3/3</text>
      <text x="132" y="272" fill="#a8946c">·  0 false successes  ·  open to 6-month internships</text>
    </g>
    <rect x="740" y="259" width="10" height="17" fill="#ffb000">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect width="800" height="300" fill="url(#vignette)"/>
  </g>
</svg>
